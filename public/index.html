<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>watchhrept</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="login" class="screen" hidden>
        <h1>watchhrept</h1>
        <p class="muted">Unofficial Zalo client. Log in with a secondary account if you can: Zalo may lock accounts that use third-party clients.</p>
        <img id="qr" alt="Zalo login QR code" hidden>
        <p id="login-hint" class="muted"></p>
        <button id="login-btn">Log in with QR code</button>
        <p id="login-error" class="error"></p>
    </section>

    <section id="app" class="screen" hidden>
        <aside id="threads-pane">
            <header>
                <span id="me"></span>
                <button id="logout-btn" class="link">Log out</button>
            </header>
            <div id="banner" class="banner" hidden>
                <span id="banner-text"></span>
                <button id="reconnect-btn" class="link">Reconnect</button>
            </div>
            <input id="search" type="search" placeholder="Search">
            <ul id="threads"></ul>
        </aside>

        <main id="chat-pane">
            <header>
                <button id="back-btn" class="link" aria-label="Back">&larr;</button>
                <span id="chat-title"></span>
            </header>
            <ol id="messages"></ol>
            <form id="composer">
                <textarea id="text" rows="1" placeholder="Message" maxlength="4000"></textarea>
                <button type="submit">Send</button>
            </form>
        </main>
    </section>

    <script type="module" src="app.js"></script>
</body>
</html>
