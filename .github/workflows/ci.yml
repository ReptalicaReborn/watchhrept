name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run bundle
      # The phone app embeds Node 18.20.4 (nodejs-mobile): check the bundle starts there with no node_modules.
      - uses: actions/setup-node@v4
        with:
          node-version: 18.20.4
      - name: Bundle smoke test on Node 18
        run: |
          mkdir -p /tmp/bundle && cp dist/server.bundle.mjs /tmp/bundle/
          cd /tmp/bundle
          node --version
          PORT=3999 ACCESS_TOKEN=t DATA_DIR=/tmp/bundle/data node server.bundle.mjs > server.log 2>&1 &
          sleep 3
          cat server.log
          curl -fsS -H "Authorization: Bearer t" localhost:3999/api/status
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3999/api/status)" = 401

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The app bundles the server (../src) with esbuild.
      - run: npm ci
        working-directory: .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: android/.nodejs-mobile
          key: nodejs-mobile-${{ hashFiles('android/app/build.gradle.kts') }}
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      # A missing runtime or bundle would only show up on the phone, as a Zalo service that never starts.
      # libnode.so needs libc++_shared.so next to it.
      - name: Check the APK contains Node.js, its C++ runtime and the server
        run: |
          for apk in app/build/outputs/apk/debug/*.apk; do
            echo "$apk: $(du -h "$apk" | cut -f1)"
            unzip -l "$apk" | grep -E "\.so$|assets/server/server\.mjs"
            for f in lib/arm64-v8a/libnode.so lib/arm64-v8a/libnodebridge.so lib/arm64-v8a/libc++_shared.so assets/server/server.mjs; do
              unzip -l "$apk" | grep -qF "$f" || { echo "::error::$f missing from $apk"; exit 1; }
            done
          done
      # One APK, for 64-bit ARM phones.
      - uses: actions/upload-artifact@v4
        with:
          name: zalo-lite-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
